<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&nbsp;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #pic {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    object-position: center;
    display: none;          /* hidden until an image is verified, so no broken-image icon */
    background: #000;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
<img id="pic" alt="" draggable="false">

<script>
/* =====================================================================
   SETTINGS - the only place you may ever want to edit
   ===================================================================== */
const DESTINATION_URL = "https://technestuk.blogspot.com/";   // <-- CHANGE THE REDIRECT LINK HERE

const REDIRECT_AFTER_SECONDS = 10;   // auto-redirect if the visitor does not click
const ROTATE_EVERY_SECONDS   = 30;   // how often the image changes (same for all visitors)
const SYNC_WITH_SERVER_TIME  = true; // use the web server's clock if the visitor's clock is wrong

// true  = the 10 seconds start counting when the picture is actually visible
//         (best for slow internet / big images - nobody is redirected from a black screen)
// false = the 10 seconds start counting the moment the page opens, even if the image has not loaded
const START_TIMER_WHEN_IMAGE_APPEARS = true;

// Safety net for the setting above: if no picture could be shown after this many
// seconds (very slow connection or broken images), redirect anyway.
const GIVE_UP_WAITING_SECONDS = 30;
/* ===================================================================== */

(function () {
  "use strict";

  var pic = document.getElementById("pic");
  var EXTENSIONS = ["jpg", "jpeg", "png", "webp", "gif", "avif", "bmp", "svg"];
  var redirected = false;

  /* ---------- Redirect: click anywhere, or automatically after the countdown ---------- */
  function go() {
    if (redirected) return;
    redirected = true;
    window.location.href = DESTINATION_URL;
  }
  document.addEventListener("click", go);   // clicking works at any moment, even on black

  // The countdown starts once and is never reset (image changes do not touch it).
  var timerStarted = false;
  function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    setTimeout(go, REDIRECT_AFTER_SECONDS * 1000);
  }
  if (START_TIMER_WHEN_IMAGE_APPEARS) {
    setTimeout(function () { if (!timerStarted) go(); }, GIVE_UP_WAITING_SECONDS * 1000);
  } else {
    startTimer();
  }

  /* ---------- Clock shared by every visitor ---------- */
  var clockOffset = 0; // ms to add to the visitor's clock
  function now() { return Date.now() + clockOffset; }

  function syncClock() {
    if (!SYNC_WITH_SERVER_TIME || !window.fetch) return Promise.resolve();
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 2000);
    var t0 = Date.now();
    return fetch(window.location.pathname + "?t=" + t0, {
      method: "HEAD", cache: "no-store", signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(timer);
      var t1 = Date.now();
      var h = r.headers.get("Date");
      if (!h) return;
      var server = new Date(h).getTime();
      if (isNaN(server)) return;
      var offset = server + (t1 - t0) / 2 - t1;
      // The Date header only has 1-second precision, so ignore small differences.
      if (Math.abs(offset) > 2500) clockOffset = offset;
    }).catch(function () { clearTimeout(timer); });
  }

  /* ---------- Image helpers ---------- */
  // Fully loads an image (used right before showing it, so it is already cached).
  function verify(url) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { resolve(true); };
      im.onerror = function () { resolve(false); };
      im.src = url;
    });
  }

  // Cheap "does this file exist?" check that does NOT download the picture.
  function exists(url) {
    var web = /^https?:$/.test(window.location.protocol);
    if (!web || !window.fetch) return verify(url);
    return fetch(url, { method: "HEAD", cache: "no-store" }).then(function (r) {
      var type = r.headers.get("Content-Type");
      if (!type) return verify(url);                  // unknown -> fall back to a real load
      return r.ok && /^image\//i.test(type);          // hosts that answer 200 with a web page do not count
    }).catch(function () { return verify(url); });
  }

  function loadManifest() {
    return new Promise(function (resolve) {
      var s = document.createElement("script");
      s.src = "images/manifest.js?v=" + Date.now();
      s.onload = function () {
        var m = window.IMAGE_MANIFEST;
        resolve(Array.isArray(m) && m.length ? m.slice() : null);
      };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
  }

  // Scan the folder: image1, image2, ... with every extension. Stops at the first missing number.
  function probeImages() {
    var found = [];
    function findNumber(n) {
      var i = 0;
      function next() {
        if (i >= EXTENSIONS.length) return Promise.resolve(null);
        var url = "images/image" + n + "." + EXTENSIONS[i++];
        return exists(url).then(function (ok) { return ok ? url : next(); });
      }
      return next();
    }
    function step(n) {
      if (n > 500) return Promise.resolve(found);
      return findNumber(n).then(function (url) {
        if (!url) return found;
        found.push(url);
        return step(n + 1);
      });
    }
    return step(1);
  }

  /* ---------- Display & rotation ---------- */
  var list = [];
  var shownIndex = -1;
  var bad = {};          // indexes that failed to load
  var reprobed = false;  // the folder is re-scanned at most once if the list looks wrong
  var generation = 0;    // lets a newer call cancel an older one still loading

  function slotIndex() {
    var slot = Math.floor(now() / (ROTATE_EVERY_SECONDS * 1000));
    return slot % list.length;
  }

  // Show the scheduled image; if it is broken, fall forward to the next working one.
  function showScheduled() {
    if (!list.length) return Promise.resolve();
    var gen = ++generation;
    var start = slotIndex();
    function attempt(k) {
      if (k >= list.length) return Promise.resolve();
      var idx = (start + k) % list.length;
      if (idx === shownIndex && !bad[idx]) return Promise.resolve();
      return verify(list[idx]).then(function (ok) {
        if (gen !== generation) return;                 // a newer request took over
        if (!ok && !reprobed) {
          // A listed file does not exist: the list is out of date. Scan the real files once.
          reprobed = true;
          return probeImages().then(function (fresh) {
            if (gen !== generation) return;
            if (fresh.length) { list = fresh; bad = {}; shownIndex = -1; return showScheduled(); }
            bad[idx] = true; return attempt(k + 1);
          });
        }
        if (!ok) { bad[idx] = true; return attempt(k + 1); }
        delete bad[idx];
        pic.src = list[idx];
        pic.style.display = "block";
        shownIndex = idx;
        startTimer();                                   // countdown begins when a picture is visible
      });
    }
    return attempt(0);
  }

  function scheduleNext() {
    var ms = ROTATE_EVERY_SECONDS * 1000;
    var wait = ms - (now() % ms) + 20;
    setTimeout(function () { showScheduled().then(scheduleNext); }, wait);
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && list.length) showScheduled();
  });

  /* ---------- Start ---------- */
  // Runs in the background AFTER the first picture is already loading, so it never delays it.
  // The list is out of date if its first/last picture is missing or an extra numbered picture exists.
  function checkManifestInBackground(m) {
    var next = "images/image" + (m.length + 1) + ".";
    var checks = [exists(m[0]), exists(m[m.length - 1])].concat(EXTENSIONS.map(function (e) { return exists(next + e); }));
    return Promise.all(checks).then(function (res) {
      var current = res[0] && res[1] && !res.slice(2).some(Boolean);
      if (current || reprobed) return;
      reprobed = true;
      if (window.console) console.warn("images/manifest.js is out of date - scanning the images folder. Run build.js / build.py to fix.");
      return probeImages().then(function (fresh) {
        if (!fresh.length || fresh.join() === list.join()) return;
        list = fresh; bad = {}; shownIndex = -1;
        return showScheduled();
      });
    }).catch(function () {});
  }

  Promise.all([loadManifest(), syncClock()]).then(function (r) {
    var m = r[0];
    if (m) {
      list = m;
      checkManifestInBackground(m);
      return showScheduled().then(scheduleNext);
    }
    return probeImages().then(function (images) {
      list = images || [];
      if (!list.length) {
        if (window.console) console.error("No images found. Put image1.jpg, image2.png ... in the images folder and run the build script.");
        return;
      }
      return showScheduled().then(scheduleNext);
    });
  });
})();
</script>
</body>
</html>
